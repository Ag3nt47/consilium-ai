name: Release

# Builds installers for macOS, Windows and Linux when a version tag (v1.2.3) is pushed, and attaches
# them to a draft GitHub release for a maintainer to review and publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # to create the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - run: node scripts/check-secrets.mjs
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Consilium ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md. Installers are not yet code-signed; see README > Install.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      # Fixed-name copies, so the README's one-click links
      # (releases/latest/download/<name>) always fetch the newest installer.
      - name: Attach one-click download names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p oneclick
          B=src-tauri/target
          copy() { # copy <find pattern> <new name>
            f="$(find "$B" -path "*/bundle/*" -name "$1" -type f | head -1)"
            if [ -z "$f" ]; then echo "::error::no bundle matching $1"; exit 1; fi
            cp "$f" "oneclick/$2"
          }
          case "$RUNNER_OS" in
            macOS)   copy '*.dmg' Consilium-macOS.dmg ;;
            Windows) copy '*-setup.exe' Consilium-Windows-Setup.exe ;;
            Linux)   copy '*.AppImage' Consilium-Linux-x86_64.AppImage
                     copy '*.deb' Consilium-Linux-amd64.deb ;;
          esac
          gh release upload "$TAG" oneclick/* --clobber --repo "$GITHUB_REPOSITORY"
