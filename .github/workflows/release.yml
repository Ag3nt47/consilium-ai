name: Release

# Publishes installers for macOS, Windows and Linux for every new version, so a copy of Consilium
# on any computer can find and install it. It runs after the CI workflow passes on main: when
# package.json's version has no GitHub release yet, it creates one, builds the installers into it
# and publishes it. A pushed version tag (v1.2.3) also publishes. Manual runs default to a draft.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft_only:
        description: Build installers and leave the release as a draft
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
      actions: read # to verify the exact commit passed CI before a manual build
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
      id: ${{ steps.v.outputs.id }}
      preview: ${{ steps.v.outputs.preview }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Confirm CI for manual build
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Build installers from main after the changes merge."
            exit 1
          fi
          ci="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion \
            --jq '.[0] | .status == "completed" and .conclusion == "success"')"
          if [ "$ci" != "true" ]; then
            echo "::error::The latest CI run for $GITHUB_SHA must pass before an installer build."
            exit 1
          fi
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PREVIEW_ALLOWED: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_only }}
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null | grep -qx false; then
            if [ "$PREVIEW_ALLOWED" = "true" ]; then
              echo "$tag is already published; building workflow artifacts for $SHA."
              { echo "tag=$tag"; echo "sha=$SHA"; echo "preview=true"; } >> "$GITHUB_OUTPUT"
            else
              echo "$tag is already published; nothing to do."
            fi
            exit 0
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$SHA" \
              --title "Consilium $tag" \
              --notes "See CHANGELOG.md. Installers are not yet code-signed; see README > Install."
          fi
          # A just-created draft can take a few seconds to appear, so wait for it rather than
          # silently skipping the build (which left 0.3.23 as an empty draft).
          id=""
          for _ in $(seq 1 12); do
            id="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId 2>/dev/null || true)"
            [ -n "$id" ] && break
            sleep 5
          done
          if [ -z "$id" ]; then echo "::error::Could not find the release for $tag"; exit 1; fi
          { echo "tag=$tag"; echo "sha=$SHA"; echo "id=$id"; } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.id != '' || needs.prepare.outputs.preview == 'true'
    permissions:
      contents: write # to create the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          # Full history: build.rs stamps the build number from `git rev-list --count HEAD`, and a
          # shallow clone made every release "#1", so linked computers could never match it.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - run: node scripts/check-secrets.mjs
      - run: npm ci
      - name: Build preview bundles
        if: needs.prepare.outputs.preview == 'true'
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.args }}
        run: |
          read -r -a build_args <<< "$TAURI_ARGS"
          npm run app:build -- "${build_args[@]}"
      - uses: tauri-apps/tauri-action@v0
        if: needs.prepare.outputs.id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.id }}
          args: ${{ matrix.args }}
      # Fixed-name copies, so the README's one-click links
      # (releases/latest/download/<name>) always fetch the newest installer.
      - name: Collect named installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREVIEW: ${{ needs.prepare.outputs.preview }}
        run: |
          set -euo pipefail
          mkdir -p oneclick
          B=src-tauri/target
          copy() { # copy <find pattern> <new name>
            f="$(find "$B" -path "*/bundle/*" -name "$1" -type f | head -1)"
            if [ -z "$f" ]; then echo "::error::no bundle matching $1"; exit 1; fi
            cp "$f" "oneclick/$2"
          }
          case "$RUNNER_OS" in
            macOS)   copy '*.dmg' Consilium-macOS.dmg ;;
            Windows) copy '*-setup.exe' Consilium-Windows-Setup.exe ;;
            Linux)   copy '*.AppImage' Consilium-Linux-x86_64.AppImage
                     copy '*.deb' Consilium-Linux-amd64.deb
                     copy '*.rpm' Consilium-Linux-x86_64.rpm ;;
          esac
          if [ "$PREVIEW" != "true" ]; then
            gh release upload "$TAG" oneclick/* --clobber --repo "$GITHUB_REPOSITORY"
          fi
      - uses: actions/upload-artifact@v7
        if: needs.prepare.outputs.preview == 'true'
        with:
          name: Consilium-preview-${{ matrix.platform }}-${{ github.run_attempt }}
          path: oneclick/
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.id != '' && (github.event_name != 'workflow_dispatch' || !inputs.draft_only)
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the release
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets)"
          for name in Consilium-Windows-Setup.exe Consilium-macOS.dmg Consilium-Linux-x86_64.AppImage Consilium-Linux-amd64.deb Consilium-Linux-x86_64.rpm; do
            if ! jq -e --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              length == 1 and (.[0] |
                .state == "uploaded" and .size > 0
                and ((.digest // "") | test("^sha256:[0-9a-f]{64}$")))
            ' <<< "$assets" > /dev/null; then
              echo "::error::Release asset $name is incomplete or has no GitHub SHA-256 digest."
              exit 1
            fi
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
