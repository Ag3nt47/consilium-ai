<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17142D"/>
      <stop offset="1" stop-color="#32245E"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF4E4"/>
      <stop offset="1" stop-color="#E9DCC0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0CF83"/>
      <stop offset="1" stop-color="#C99B4A"/>
    </linearGradient>
    <!-- A classical profile facing right; the right-hand one is its mirror image. -->
    <path id="profile" d="M330 852 L330 500 C330 420 372 372 424 368 C458 366 478 392 478 428
      C478 440 476 448 479 457 L491 494 C493 501 487 505 478 505 C481 512 485 517 481 523 L474 527
      C481 531 483 537 477 543 C472 551 477 560 479 568 C479 582 467 590 452 592 L442 600 L442 852 Z"/>
  </defs>

  <!-- Background squircle -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>

  <!-- Soft shadow under the arch -->
  <path d="M232 866 L232 446 A280 280 0 0 1 816 446 L816 866 Z" fill="#000" opacity="0.18"/>

  <!-- Plinth -->
  <rect x="188" y="850" width="648" height="34" rx="6" fill="url(#ivory)"/>

  <!-- The Roman arch -->
  <path d="M220 850 L220 430 A292 292 0 0 1 804 430 L804 850 L694 850 L694 430 A182 182 0 0 0 330 430 L330 850 Z"
        fill="url(#ivory)" stroke="#C99B4A" stroke-width="10" stroke-linejoin="round"/>

  <!-- Two faces in council -->
  <use href="#profile" fill="url(#ivory)"/>
  <use href="#profile" fill="url(#ivory)" transform="translate(1024 0) scale(-1 1)"/>

  <!-- Council spark between them -->
  <path d="M512 486 C516 512 522 518 548 522 C522 526 516 532 512 558 C508 532 502 526 476 522 C502 518 508 512 512 486 Z"
        fill="url(#gold)"/>
</svg>
