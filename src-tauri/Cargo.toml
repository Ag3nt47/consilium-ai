[package]
name = "consilium"
version = "0.2.1"
description = "A council of minds: several AIs and a human in one conversation"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "consilium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "fs", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
tauri-plugin-dialog = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
