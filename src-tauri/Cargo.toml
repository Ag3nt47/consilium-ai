[package]
name = "consilium"
version = "0.3.23"
description = "A council of minds: several AIs and a human in one conversation"
license = "MIT"
edition = "2021"
rust-version = "1.89"

[lib]
name = "consilium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "fs", "macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
regex = "1"
hmac = "0.12"
sha2 = "0.10"
spake2 = "0.4"
chacha20poly1305 = "0.10"
if-addrs = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-dialog = "2"
sysinfo = "0.37"
tauri-plugin-window-state = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[profile.release]
strip = true
lto = "thin"
